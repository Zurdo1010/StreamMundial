coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }

work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
datastore = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

leanback = { group = "androidx.leanback", name = "leanback", version.ref = "leanback" }
tv-compose-foundation = { group = "androidx.tv", name = "tv-foundation", version.ref = "tv-compose" }
tv-compose-material = { group = "androidx.tv", name = "tv-material", version.ref = "tv-compose" }

coil = { group = "io.coil-kt", name = "coil-compose", version = "2.7.0" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
